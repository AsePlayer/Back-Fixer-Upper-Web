name: Deploy committed site
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: 'Optional exact 40-character commit SHA to redeploy without scanning YouTube'
        type: string
        required: false
permissions: {}
jobs:
  pages:
    if: github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ inputs.commit || github.sha }}
